<!DOCTYPE html>
<html>
<head>
    <title>Even Numbers from 1 to 50</title>
</head>
<body style="font-size:28px;">

    <h2>Even Numbers from 1 to 50</h2>
    <p id="output"></p>

    <script>
        let i = 1; 
        let result = "";

        while (i <= 50) {
            if (i % 2 == 0) {   
                result += i + "<br>";
            }
            i = i + 1; 
        }

        document.getElementById("output").innerHTML = result;
    </script>

</body>
</html>
