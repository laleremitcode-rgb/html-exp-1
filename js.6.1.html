<!DOCTYPE html>
<html>
<body>

<h1 style="color:green;">Variables & Data Types:</h1>

<p id="demo"></p>

<script>
let name = "Ramesh";
let age = 16;
let student = true;

document.getElementById("demo").innerHTML = "Name: " + name + "<br>" + "Age: " + age + "<br>" + "Student: " + student + "<br>" + "Type of name: " + typeof name + "<br>" + "Type of age: " + typeof age + "<br>" + "Type of student: " + typeof student;
</script>

</body>
</html>
