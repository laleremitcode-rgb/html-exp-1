<!DOCTYPE html>
<html>
<head>
<style>
@keyframes example {
  from { background-color: orange; }
  to { background-color: yellow; }
}

body {
  margin: 0;
  padding: 0;
  background-color: #cceeff;
  font-family: Arial, sans-serif;
}


.sun {
  width: 100px;
  height: 100px;
  background-color: orange;
  border-radius: 50%;
  animation-name: example;
  animation-duration: 4s;
  transition: width 2s, height 2s;
  position: absolute;
  top: 20px;
  right: 20px;
}

.sun:hover {
  width: 150px;
  height: 150px;
}


.tree-row {
  display: flex;
  gap: 40px;
  margin-left: 50px;
  margin-top: 150px;
}


.tree {
  text-align: center;
}


.trunk {
  width: 20px;
  height: 80px;
  background-color: brown;
  margin: 0 auto;
  transition: height 2s;
}


.leaf {
  width: 60px;
  height: 60px;
  background-color: green;
  border-radius: 50%;
  margin: 5px auto;
  transition: width 2s, height 2s;
}

.leaf:hover {
  width: 80px;
  height: 80px;
}

.trunk:hover {
  height: 100px;
}
</style>
</head>
<body>

<h2 style="text-align:center;">Sun and Trees</h2>

<div class="sun"></div>

<div class="tree-row">
  <div class="tree">
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="trunk"></div>
  </div>
  <div class="tree">
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="trunk"></div>
  </div>
  <div class="tree">
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="trunk"></div>
  </div>
</div>

</body>
</html>
