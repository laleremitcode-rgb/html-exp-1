<!DOCTYPE html>
<html>
<head>
  <title>Exp 12.1 - Greet Function</title>
</head>
<body>
  <h2>Simple Function - greet()</h2>
  <pre id="output"></pre>

  <script>
    function greet() {
      return "Welcome to JavaScript Functions!";
    }

    document.getElementById("output").textContent = greet();
  </script>
</body>
</html>
