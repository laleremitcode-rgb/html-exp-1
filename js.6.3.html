<!DOCTYPE html>
<html>
<head>
  <title>Simple Calculator</title>
</head>
<body>
  <h1 style="color:darkblue;">Simple Calculator</h1>
  <p id="demo" style="font-size:40px; color:green;"></p>

  <script>
    let num1 = Number(prompt("Enter the first number:"));
    let num2 = Number(prompt("Enter the second number:"));
    let operator = prompt("Enter an operator (+, -, *, /, %):");

    let result;

    switch (operator) {
      case "+":
        result = num1 + num2;
        break;
      case "-":
        result = num1 - num2;
        break;
      case "*":
        result = num1 * num2;
        break;
      case "/":
        if (num2 !== 0) {
          result = num1 / num2;
        } else {
          result = "Error: Division by zero!";
        }
        break;
      case "%":
        if (num2 !== 0) {
          result = num1 % num2;
        } else {
          result = "Error: Modulus by zero!";
        }
        break;
      default:
        result = "Invalid operator!";
    }

    document.getElementById("demo").innerHTML = 
      num1 + " " + operator + " " + num2 + " = " + result;
  </script>
</body>
</html>
