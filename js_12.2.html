<!DOCTYPE html>
<html>
<head>
  <title>Exp 12.2 - Add Function</title>
</head>
<body>
  <h2>Add Two Numbers using Function</h2>
  <pre id="output"></pre>

  <script>
    function add(a, b) {
      return a + b;
    }

    let result = add(10, 20);

    document.getElementById("output").textContent = "10 + 20 = " + result;
  </script>
</body>
</html>
