<!DOCTYPE html>
<html>
<body>

<p id="demo" style="font-size:24px; color:green;"></p>

<script>
let num1 = Number(prompt("Enter the first number:"));
let num2 = Number(prompt("Enter the second number:"));
let num3 = Number(prompt("Enter the third number:"));

alert("You entered: " + num1 + ", " + num2 + ", " + num3);

function myFunction(num) {
    if (num % 2 == 0) {
        return "EVEN";
    } else {
        return "ODD";
    }
}

function greatest(a, b, c) {
    if (a >= b && a >= c) {
        return a;
    } else if (b >= a && b >= c) {
        return b;
    } else {
        return c;
    }
}

let evenOddResult = myFunction(num1);
let greatestNum = greatest(num1, num2, num3);

document.getElementById("demo").innerHTML = 
    "The first number " + num1 + " is " + evenOddResult + "<br>" +
    "The greatest number among " + num1 + ", " + num2 + ", " + num3 + " is " + greatestNum;
</script>

</body>
</html>
