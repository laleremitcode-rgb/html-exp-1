<!DOCTYPE html>
<html>
<head>
    <title>Linear Search</title>
</head>
<body style="font-size:45px;">
<p id="output"></p>
<script>
let arr = [];
for(let i = 0; i < 10; i++) {
    arr[i] = Number(prompt("Enter number " + (i+1)));
}
let key = Number(prompt("Enter element to search"));
let found = -1;
for(let i = 0; i < arr.length; i++) {
    if(arr[i] === key) {
        found = i + 1;
        break;
    }
}
if(found !== -1)
    alert("Element found at position " + found);
else
    alert("Element not found");

document.getElementById("output").innerText = found !== -1 ? 
    "Element found at position " + found : "Element not found";
</script>
</body>
</html>
