<!DOCTYPE html>
<html>
<head>
    <title>Reverse Array</title>
</head>
<body  style = "font-size:40px;">
<p id="output"></p>
<script>
let arr = [];
for(let i = 0; i < 10; i++) {
    arr[i] = Number(prompt("Enter number " + (i+1)));
}
for(let i = 0; i < arr.length / 2; i++) {
    let temp = arr[i];
    arr[i] = arr[arr.length - 1 - i];
    arr[arr.length - 1 - i] = temp;
}
alert("Reversed Array: " + arr.join(", "));
document.getElementById("output").innerText = "Reversed Array: " + arr.join(", ");
</script>
</body>
</html>
