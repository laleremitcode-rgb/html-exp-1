<!DOCTYPE html>
<html>
<head>
  <title>Exp 12.3 - Square Function</title>
</head>
<body>
  <h2>Square of a Number using Function</h2>
  <pre id="output"></pre>

  <script>
    function square(num) {
      return num * num;
    }

    let n = 7;

    document.getElementById("output").textContent = "Square of " + n + " = " + square(n);
  </script>
</body>
</html>
