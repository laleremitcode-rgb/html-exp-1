<!DOCTYPE html>
<html>
<head>
    <title>Max & Min Array</title>
</head>
<body style ="font-size:40px;">
<p id="output"></p>
<script>
let arr = [];
for(let i = 0; i < 10; i++) {
    arr[i] = parseInt(prompt("Enter integer " + (i+1)));
}
let max = arr[0], min = arr[0];
for(let i = 1; i < arr.length; i++) {
    if(arr[i] > max) max = arr[i];
    if(arr[i] < min) min = arr[i];
}
alert("Max: " + max + "\nMin: " + min);
document.getElementById("output").innerText = "Max: " + max + "  Min: " + min;
</script>
</body>
</html>
